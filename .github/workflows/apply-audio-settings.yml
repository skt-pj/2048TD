name: Apply audio settings UI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-audio-settings.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch web audio settings
        run: python3 .github/scripts/apply_audio_settings.py

      - name: Commit audio settings
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-audio-settings.yml .github/scripts/apply_audio_settings.py
          git add docs/index.html docs/src/main.js docs/src/bootstrap.js
          git commit -m 'Wire BGM controls into web settings'
          git pull --rebase origin main
          git push origin HEAD:main
