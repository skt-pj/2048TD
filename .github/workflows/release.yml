name: Android Release

on:
  push:
    branches:
      - main
    paths:
      - 'version.properties'
      - 'app/**'
      - 'ci/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(grep '^VERSION_NAME=' version.properties | cut -d= -f2)"
          VERSION_CODE="$(grep '^VERSION_CODE=' version.properties | cut -d= -f2)"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Check whether version is already released
        id: release_check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          if gh release view "v${VERSION_NAME}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "v${VERSION_NAME} already exists; release build is skipped."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.release_check.outputs.should_release == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: steps.release_check.outputs.should_release == 'true'
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        if: steps.release_check.outputs.should_release == 'true'
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        if: steps.release_check.outputs.should_release == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Restore fixed signing key
        if: steps.release_check.outputs.should_release == 'true'
        run: bash ci/restore-signing-key.sh

      - name: Test and build signed release APK
        if: steps.release_check.outputs.should_release == 'true'
        run: gradle :app:testDebugUnitTest :app:assembleRelease --stacktrace

      - name: Prepare release files
        if: steps.release_check.outputs.should_release == 'true'
        id: files
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          APK_SOURCE="app/build/outputs/apk/release/app-release.apk"
          APK_TARGET="2048TD-v${VERSION_NAME}-release.apk"
          cp "$APK_SOURCE" "$APK_TARGET"
          sha256sum "$APK_TARGET" > "${APK_TARGET}.sha256"
          keytool -printcert -jarfile "$APK_TARGET" | tee signing-certificate.txt
          echo "apk=$APK_TARGET" >> "$GITHUB_OUTPUT"

      - name: Upload release artifact
        if: steps.release_check.outputs.should_release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: 2048TD-v${{ steps.version.outputs.name }}-release
          path: |
            ${{ steps.files.outputs.apk }}
            ${{ steps.files.outputs.apk }}.sha256
            signing-certificate.txt
          if-no-files-found: error

      - name: Create GitHub Release
        if: steps.release_check.outputs.should_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          APK_FILE: ${{ steps.files.outputs.apk }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION_NAME}" \
            "$APK_FILE" \
            "${APK_FILE}.sha256" \
            signing-certificate.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "2048TD v${VERSION_NAME}" \
            --notes "Android release APK. versionName=${VERSION_NAME}, versionCode=${VERSION_CODE}. Signed with the stable 2048TD release key."
