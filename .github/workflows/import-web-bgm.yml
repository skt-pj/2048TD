name: Import uploaded BGM

on:
  push:
    branches: [main]
    paths:
      - .bgm-import/**

permissions:
  contents: write

jobs:
  import-bgm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore verified BGM from uploaded MP3 payload
        shell: bash
        env:
          TRANSFER_URL: "https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-d2f4-8206-962d-5ee487645b18/raw?se=2026-09-12T05%3A47%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=92627af6-3a53-59a1-8ab3-23414ccdd75d&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-11T22%3A32%3A41Z&ske=2026-09-12T22%3A32%3A41Z&sks=b&skv=2026-02-06&sig=HRCrTf1yTe2kZnIZUjJmIMHwKsD2J7yqvNjxQvTAoCw%3D"
        run: |
          set -euo pipefail
          mkdir -p docs/assets/audio /tmp/bgm
          curl --fail --silent --show-error --location "$TRANSFER_URL" -o /tmp/bgm/transfer.txt
          echo '13e8a152ccb54edec2c63b0f3b8d46c0b5fe790afbab86013258fbeef8d95638  /tmp/bgm/transfer.txt' | sha256sum -c -

          python3 - <<'PY'
          import base64, hashlib, json, pathlib
          src = pathlib.Path('/tmp/bgm/transfer.txt')
          payload = json.loads(src.read_text())
          expected = {
              'default.ogg': (395563, '329f79d7840508c78292043c74be38a7370597a4a482511b2e34faa7e01b78fe'),
              'fiver.ogg': (344254, 'c92c81a14b0fcf019e8a555534d4a6081f1b887c9324dff79161b169a93156bb'),
          }
          outdir = pathlib.Path('docs/assets/audio')
          for name, (size, sha) in expected.items():
              item = payload[name]
              data = base64.b64decode(item['base64'], validate=True)
              assert len(data) == size, (name, len(data), size)
              assert hashlib.sha256(data).hexdigest() == sha, name
              (outdir / name).write_bytes(data)
          PY

          echo '329f79d7840508c78292043c74be38a7370597a4a482511b2e34faa7e01b78fe  docs/assets/audio/default.ogg' | sha256sum -c -
          echo 'c92c81a14b0fcf019e8a555534d4a6081f1b887c9324dff79161b169a93156bb  docs/assets/audio/fiver.ogg' | sha256sum -c -
          test "$(stat -c%s docs/assets/audio/default.ogg)" = 395563
          test "$(stat -c%s docs/assets/audio/fiver.ogg)" = 344254
          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1:nk=1 docs/assets/audio/default.ogg)" = opus
          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1:nk=1 docs/assets/audio/fiver.ogg)" = opus

      - name: Commit BGM and remove temporary importer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/audio/default.ogg docs/assets/audio/fiver.ogg
          git rm -r .bgm-import .github/workflows/import-web-bgm.yml
          git commit -m 'Add uploaded web BGM assets'
          git pull --rebase origin main
          git push origin HEAD:main
