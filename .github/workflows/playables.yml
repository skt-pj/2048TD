name: YouTube Playables Bundle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "ci/build-playables.sh"
      - "ci/test-*.mjs"
      - "ci/vfx-phase5-qa.*"
      - "ci/verify-playables-vfx-parity.mjs"
      - ".github/workflows/playables.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "ci/build-playables.sh"
      - "ci/test-*.mjs"
      - "ci/vfx-phase5-qa.*"
      - "ci/verify-playables-vfx-parity.mjs"
      - ".github/workflows/playables.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Playables bundle
        run: bash ci/build-playables.sh
      - name: Upload Playables ZIP
        uses: actions/upload-artifact@v4
        with:
          name: 2048TD-playables
          path: build/2048TD-playables.zip
          if-no-files-found: error
      - name: Upload P5 VFX QA captures
        uses: actions/upload-artifact@v4
        with:
          name: vfx-phase5-qa
          path: |
            build/vfx-phase5-web.png
            build/vfx-phase5-playables.png
          if-no-files-found: error
