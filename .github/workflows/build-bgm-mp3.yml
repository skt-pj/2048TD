name: Build MP3 BGM compatibility assets

on:
  push:
    branches: [main]
    paths:
      - .bgm-mp3-build/**

permissions:
  contents: write

jobs:
  build-mp3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build MP3 compatibility assets
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p docs/assets/audio

          ffmpeg -hide_banner -loglevel error -y \
            -i docs/assets/audio/default.ogg \
            -map_metadata -1 -vn -c:a libmp3lame -b:a 96k -ar 48000 -ac 2 \
            docs/assets/audio/default.mp3

          ffmpeg -hide_banner -loglevel error -y \
            -i docs/assets/audio/fiver.ogg \
            -map_metadata -1 -vn -c:a libmp3lame -b:a 96k -ar 48000 -ac 2 \
            docs/assets/audio/fiver.mp3

          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1:nk=1 docs/assets/audio/default.mp3)" = mp3
          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1:nk=1 docs/assets/audio/fiver.mp3)" = mp3

          default_duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 docs/assets/audio/default.mp3)"
          fiver_duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 docs/assets/audio/fiver.mp3)"
          python3 - "$default_duration" "$fiver_duration" <<'PY'
          import sys
          d = float(sys.argv[1])
          f = float(sys.argv[2])
          if not (89.0 <= d <= 90.2):
              raise SystemExit(f"Unexpected default duration: {d}")
          if not (80.7 <= f <= 81.8):
              raise SystemExit(f"Unexpected fever duration: {f}")
          PY

          ls -lh docs/assets/audio/default.mp3 docs/assets/audio/fiver.mp3
          sha256sum docs/assets/audio/default.mp3 docs/assets/audio/fiver.mp3

      - name: Commit assets and remove temporary builder
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/audio/default.mp3 docs/assets/audio/fiver.mp3
          git rm -r .bgm-mp3-build .github/workflows/build-bgm-mp3.yml
          git commit -m 'Add MP3 BGM compatibility assets'
          git pull --rebase origin main
          git push origin HEAD:main
