name: Import web BGM

on:
  push:
    branches: [main]
    paths:
      - .bgm-import/**

permissions:
  contents: write

jobs:
  import-bgm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified source tracks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bgm docs/assets/audio

          download_clip() {
            local clip_id="$1"
            local output="$2"
            curl --fail --silent --show-error --location \
              --retry 4 --retry-delay 2 --retry-all-errors \
              --get 'https://sunodownloader.ai/api/download' \
              --data-urlencode "url=https://suno.com/song/${clip_id}" \
              --data-urlencode 'format=mp3' \
              --output "$output"
            test -s "$output"
            ffprobe -v error -select_streams a:0 \
              -show_entries stream=codec_name,channels \
              -of default=nw=1 "$output"
          }

          download_clip 'e77efb54-7aa0-41d6-adf3-e11bb56f0877' /tmp/bgm/default.mp3
          download_clip '9bd397e9-5ddf-49de-b6da-ca7832c9e7fe' /tmp/bgm/fiver.mp3

          default_source_duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 /tmp/bgm/default.mp3)"
          fiver_source_duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 /tmp/bgm/fiver.mp3)"
          python3 - "$default_source_duration" "$fiver_source_duration" <<'PY'
          import sys
          d, f = map(float, sys.argv[1:])
          if not (88.0 <= d <= 91.0):
              raise SystemExit(f"Unexpected default source duration: {d}")
          if not (80.0 <= f <= 83.0):
              raise SystemExit(f"Unexpected fiver source duration: {f}")
          print(f"verified source durations: default={d:.3f}s fiver={f:.3f}s")
          PY

      - name: Encode and validate optimized Ogg BGM
        shell: bash
        run: |
          set -euo pipefail
          for name in default fiver; do
            ffmpeg -hide_banner -loglevel error -y -i "/tmp/bgm/${name}.mp3" \
              -map_metadata -1 -vn -c:a libopus -b:a 32k -vbr on \
              -compression_level 10 -application audio -ar 48000 -ac 2 \
              "docs/assets/audio/${name}.ogg"
          done

          default_size="$(stat -c%s docs/assets/audio/default.ogg)"
          fiver_size="$(stat -c%s docs/assets/audio/fiver.ogg)"
          test "$default_size" -gt 250000
          test "$fiver_size" -gt 250000

          default_duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 docs/assets/audio/default.ogg)"
          fiver_duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 docs/assets/audio/fiver.ogg)"
          python3 - "$default_duration" "$fiver_duration" <<'PY'
          import sys
          d, f = map(float, sys.argv[1:])
          if not (88.0 <= d <= 91.0):
              raise SystemExit(f"Unexpected default Ogg duration: {d}")
          if not (80.0 <= f <= 83.0):
              raise SystemExit(f"Unexpected fiver Ogg duration: {f}")
          PY

          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,channels -of default=nw=1 docs/assets/audio/default.ogg
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,channels -of default=nw=1 docs/assets/audio/fiver.ogg
          sha256sum docs/assets/audio/default.ogg docs/assets/audio/fiver.ogg
          ls -l docs/assets/audio/default.ogg docs/assets/audio/fiver.ogg

      - name: Commit final BGM assets and remove importer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/audio/default.ogg docs/assets/audio/fiver.ogg
          git rm -r .bgm-import .github/workflows/import-web-bgm.yml
          git commit -m 'Add verified web BGM assets'
          git pull --rebase origin main
          git push origin HEAD:main
