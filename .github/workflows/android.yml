name: Android Signed Build

on:
  push:
    branches:
      - 'build/**'
      - 'agent/**'
    paths:
      - 'version.properties'
      - 'app/**'
      - 'ci/apply-combo-fever-build.py'
      - 'ci/apply-vector-effects-build.py'
      - 'ci/apply-commercial-vfx-build.py'
      - 'ci/apply-pad-combo-fever-polish.py'
      - 'ci/apply-particle-library-vfx.py'
      - 'ci/apply-fever-presence-vfx.py'
      - '.github/workflows/android.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'version.properties'
      - 'app/**'
      - 'ci/apply-combo-fever-build.py'
      - 'ci/apply-vector-effects-build.py'
      - 'ci/apply-commercial-vfx-build.py'
      - 'ci/apply-pad-combo-fever-polish.py'
      - 'ci/apply-particle-library-vfx.py'
      - 'ci/apply-fever-presence-vfx.py'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(grep '^VERSION_NAME=' version.properties | cut -d= -f2)"
          VERSION_CODE="$(grep '^VERSION_CODE=' version.properties | cut -d= -f2)"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Apply COMBO and FEVER integration patch
        run: python3 ci/apply-combo-fever-build.py

      - name: Apply vector effect integration patch
        run: python3 ci/apply-vector-effects-build.py

      - name: Apply commercial event-driven VFX integration
        run: python3 ci/apply-commercial-vfx-build.py

      - name: Apply PAD-style COMBO and FEVER polish
        run: python3 ci/apply-pad-combo-fever-polish.py

      - name: Apply Konfetti battlefield VFX
        run: python3 ci/apply-particle-library-vfx.py

      - name: Apply persistent FEVER battlefield presentation
        run: python3 ci/apply-fever-presence-vfx.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Restore fixed signing key
        run: bash ci/restore-signing-key.sh

      - name: Run unit tests and build signed release APK
        run: gradle :app:testDebugUnitTest :app:assembleRelease --stacktrace

      - name: Prepare signed APK and verification files
        id: files
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          APK_SOURCE="app/build/outputs/apk/release/app-release.apk"
          APK_TARGET="2048TD-v${VERSION_NAME}-release.apk"
          cp "$APK_SOURCE" "$APK_TARGET"
          sha256sum "$APK_TARGET" > "${APK_TARGET}.sha256"
          keytool -printcert -jarfile "$APK_TARGET" | tee signing-certificate.txt
          echo "apk=$APK_TARGET" >> "$GITHUB_OUTPUT"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v7
        with:
          name: 2048TD-v${{ steps.version.outputs.name }}-signed-build
          path: |
            ${{ steps.files.outputs.apk }}
            ${{ steps.files.outputs.apk }}.sha256
            signing-certificate.txt
          if-no-files-found: error

      - name: Record successful push build run
        if: success() && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n%s\n%s\n' \
            "${GITHUB_RUN_ID}" \
            "${GITHUB_SHA}" \
            "2048TD-v${{ steps.version.outputs.name }}-signed-build" \
            > ci/last-signed-build-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/last-signed-build-run.txt
          git commit -m "Record signed build run ${GITHUB_RUN_ID}"
          git push
