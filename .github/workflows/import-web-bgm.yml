name: Import web BGM

on:
  push:
    branches: [main]
    paths:
      - .bgm-import/**

permissions:
  contents: write

jobs:
  import-bgm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Reassemble uploaded BGM assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/assets/audio
          cat .bgm-import/default/*.b64 | base64 --decode > docs/assets/audio/default.ogg
          cat .bgm-import/fiver/*.b64 | base64 --decode > docs/assets/audio/fiver.ogg
          test -s docs/assets/audio/default.ogg
          test -s docs/assets/audio/fiver.ogg
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,channels -of default=nw=1 docs/assets/audio/default.ogg
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,channels -of default=nw=1 docs/assets/audio/fiver.ogg

      - name: Commit final BGM assets and remove importer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/audio/default.ogg docs/assets/audio/fiver.ogg
          git rm -r .bgm-import .github/workflows/import-web-bgm.yml
          git commit -m "Add web BGM assets"
          git push origin HEAD:main
