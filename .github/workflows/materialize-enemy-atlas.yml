name: Materialize Enemy Atlas

on:
  push:
    branches: [main]
    paths:
      - ".tmp/enemy-atlas/**"
      - ".github/workflows/materialize-enemy-atlas.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize verified atlas
        shell: bash
        run: |
          cat .tmp/enemy-atlas/part-* > /tmp/enemy_normal_atlas.b64
          base64 -d /tmp/enemy_normal_atlas.b64 > docs/assets/sprites/enemies/enemy_normal_atlas.png
          echo "d5616fd6a5a3fd46d2a8d65c8590a6e63d316069397f92a04eae88c518f4b980  docs/assets/sprites/enemies/enemy_normal_atlas.png" | sha256sum -c -
          file docs/assets/sprites/enemies/enemy_normal_atlas.png | grep -q "PNG image data, 512 x 768"

      - name: Build verified Playables bundle
        run: bash ci/build-playables.sh

      - name: Upload verified Playables bundle
        uses: actions/upload-artifact@v4
        with:
          name: 2048TD-playables-verified
          path: build/2048TD-playables.zip
          if-no-files-found: error

      - name: Commit verified atlas
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/sprites/enemies/enemy_normal_atlas.png
          git commit -m "Materialize verified E01-E04 enemy atlas"
          git push
