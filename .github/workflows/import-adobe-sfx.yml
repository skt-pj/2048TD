name: Import Adobe SFX

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-adobe-sfx.yml'

permissions:
  contents: write

jobs:
  import-sfx:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate web SFX modules
        shell: bash
        run: |
          node --check docs/src/audio.js
          node --check docs/src/bootstrap.js

      - name: Install ffmpeg
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Download and select Adobe Audition SFX
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://download.adobe.com/pub/adobe/audition/offers/adobeauditiondlcsfx'
          TMP="$RUNNER_TEMP/adobe-sfx"
          OUT='docs/assets/sfx'
          mkdir -p "$TMP" "$OUT"

          for pack in cartoon crashes multimedia science_fiction weapons; do
            echo "Downloading $pack.zip"
            curl -fL --retry 3 --retry-delay 2 "$BASE/$pack.zip" -o "$TMP/$pack.zip"
            mkdir -p "$TMP/$pack"
            unzip -q "$TMP/$pack.zip" -d "$TMP/$pack"
          done

          : > "$OUT/SOURCES.tsv"
          printf 'output\tadobe_pack\toriginal_file\n' >> "$OUT/SOURCES.tsv"

          pick_exact() {
            local output="$1"
            local pack="$2"
            local relative="$3"
            local source="$TMP/$pack/$relative"
            if [[ ! -f "$source" ]]; then
              echo "Adobe source not found: $source" >&2
              exit 1
            fi
            ffmpeg -hide_banner -loglevel error -y -i "$source" -vn -ar 44100 -ac 2 -codec:a libmp3lame -b:a 112k "$OUT/$output.mp3"
            printf '%s\t%s\t%s\n' "$output.mp3" "$pack" "$relative" >> "$OUT/SOURCES.tsv"
            echo "$output <= $pack :: $relative"
          }

          pick_exact ui_click multimedia 'Multimedia/Multimedia Internet CD-Rom Flash Beep Electronic 01.wav'
          pick_exact board_move cartoon 'Cartoon/Cartoon Trombone Slide 01.wav'
          pick_exact tile_merge cartoon 'Cartoon/Cartoon Balloon Pop 01.wav'
          pick_exact combo multimedia 'Multimedia/Multimedia Internet CD-Rom Flash Ding 01.wav'
          pick_exact fever_start science_fiction 'Science Fiction/Science Fiction Sci-Fi Electronic  Energy Swell Fluttering 07.wav'
          pick_exact fever_end science_fiction 'Science Fiction/Science Fiction Sci-Fi Electronic Alarm Descending 01.wav'
          pick_exact weapon_evolve science_fiction 'Science Fiction/Science Fiction Sci-Fi Electronic Power Up37.wav'
          pick_exact weapon_normal weapons 'Weapons/Weapon Gun Pistol 22 Caliber Single Shot Interior Shooting Range 01.wav'
          pick_exact weapon_rapid weapons 'Weapons/Weapon Gun Pistol 45 Caliber Single Shot Interior Shooting Range 02.wav'
          pick_exact weapon_machine_gun weapons 'Weapons/Weapon Gun Machine Gun 9mm Single Shot Interior Shooting Range 01.wav'
          pick_exact weapon_piercing weapons 'Weapons/Weapon Arrow Shot 01.wav'
          pick_exact weapon_explosive weapons 'Weapons/Weapon Cannon Fire 01.wav'
          pick_exact weapon_laser science_fiction 'Science Fiction/Science Fiction Sci-Fi Laser Single Shot Short 01.wav'
          pick_exact impact crashes 'Crashes/Crash Aluminum Tray Bang 02.wav'
          pick_exact enemy_kill cartoon 'Cartoon/Cartoon Balloon Popping 04 .wav'
          pick_exact boss_kill crashes 'Crashes/Crash Crash Metal Wood Heavy Thud 03.wav'
          pick_exact boss_warning science_fiction 'Science Fiction/Science Fiction Sci-Fi Electronic Warning Siren Once 28.wav'
          pick_exact wave multimedia 'Multimedia/Multimedia Internet CD-Rom Flash Beep Evolver 01.wav'
          pick_exact base_damage crashes 'Crashes/Crash Brick On Pavement 01.wav'
          pick_exact game_over multimedia 'Multimedia/Multimedia Internet CD-Rom Flash Window Close 01.wav'

          cat > "$OUT/README.md" <<'EOF'
          # Adobe Audition SFX used by 2048TD

          These game sound effects are selected from Adobe Audition's downloadable Sound Effects collection and transcoded to MP3 for the web build.

          Source: https://www.adobe.com/products/audition/offers/adobeauditiondlcsfx.html

          Adobe states that the collection is royalty-free and that use/distribution is governed by the Adobe Audition EULA. The source Content Files must not be distributed on a standalone basis. These files are included only as integrated game assets for 2048TD.

          `SOURCES.tsv` records the exact Adobe archive and original source filename used for each integrated asset. Selections are deterministic so the web assets can be reproduced.
          EOF

      - name: Commit selected SFX assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git rebase origin/main
          git add docs/assets/sfx
          if git diff --cached --quiet; then
            echo 'No SFX changes to commit.'
            exit 0
          fi
          git commit -m 'Import selected Adobe Audition SFX assets'
          git push origin HEAD:main
